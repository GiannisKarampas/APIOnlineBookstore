name: API Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'    # nightly: the full suite
    - cron: '0 3 * * 1'    # Monday: the dependency audit
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to execute'
        type: choice
        default: FULL_RUN
        options: [ FULL_RUN, SMOKE_RUN, BOOKS_ONLY ]
      run_audit:
        description: 'Also run the dependency audit'
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'
  WEEKLY_AUDIT_CRON: '0 3 * * 1'

# A new push to a branch makes the run in progress irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # Lane 1 - always, and fast. Nothing here can fail because of somebody else.
  # ---------------------------------------------------------------------------

  static-analysis:
    name: Formatting and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule != '0 3 * * 1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Check formatting and static analysis
        run: ./mvnw -B spotless:check checkstyle:check

  framework-tests:
    name: Framework tests (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.schedule != '0 3 * * 1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run the framework tests
        run: ./mvnw -B clean test -Dsuite.xml=src/test/resources/test-suites/FRAMEWORK.xml

      - name: Upload the framework results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-results-${{ github.run_number }}
          path: |
            test-results/summary
            test-results/allure-results
            target/surefire-reports
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Lane 2 - the API. Which subset runs depends on the event.
  # ---------------------------------------------------------------------------

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ static-analysis, framework-tests ]
    if: github.event.schedule != '0 3 * * 1'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Decide which lane this event belongs to
        id: lane
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              # Eight checks. Enough to catch a broken request before it merges,
              # short enough that a cold sandbox rarely costs anyone the afternoon.
              echo "name=smoke" >> "$GITHUB_OUTPUT"
              echo "args=-Dsuite.xml=src/test/resources/test-suites/SMOKE_RUN.xml" >> "$GITHUB_OUTPUT"
              ;;
            schedule)
              # Everything, provider characterisation included. Nothing is being
              # merged at 06:00, so this is the right place to learn the provider
              # changed something.
              echo "name=nightly - the full suite" >> "$GITHUB_OUTPUT"
              echo "args=" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              echo "name=${{ inputs.suite }} (requested)" >> "$GITHUB_OUTPUT"
              echo "args=-Dsuite.xml=src/test/resources/test-suites/${{ inputs.suite }}.xml" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # Everything except the tests that pin provider behaviour. Those fail
              # when FakeRestAPI improves, which must never block a merge.
              echo "name=regression, excluding provider characterisation" >> "$GITHUB_OUTPUT"
              echo "args=-DexcludedGroups=provider-behaviour" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run ${{ steps.lane.outputs.name }}
        run: ./mvnw -B clean test -Pdev ${{ steps.lane.outputs.args }}

      - name: Generate the Allure report
        if: always()
        run: ./mvnw -B io.qameta.allure:allure-maven:report

      - name: Publish the summary to the run page
        if: always()

        run: |
          {
            echo "## ${{ steps.lane.outputs.name }}"
            echo
            if [ -f test-results/summary/summary.md ]; then
              cat test-results/summary/summary.md
            else
              echo "No test summary was produced - the build failed before the suite ran."
              echo "See the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report
          retention-days: 30

      - name: Upload the execution summary and raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results/summary
            test-results/allure-results
            target/surefire-reports
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Lane 3 - supply chain.
  # ---------------------------------------------------------------------------

  dependency-audit:
    name: Audit dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.schedule == '0 3 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.run_audit)

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Restore the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-

      - name: Audit
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DskipTests

      - name: Upload the audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-${{ github.run_number }}
          path: target/dependency-check-report.html
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publishing. Trunk only, so a pull request cannot overwrite what is published.
  # ---------------------------------------------------------------------------

  publish-report:
    name: Publish the report to GitHub Pages
    runs-on: ubuntu-latest
    needs: api-tests
    if: always() && needs.api-tests.result != 'skipped' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download the Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report

      - name: Package the report for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
