# Configuration for the 'local' environment.
# Selected with: mvn test -Plocal

# Points at a locally hosted copy of the API (e.g. the FakeRestAPI container).
rest.url=http://localhost:8080

# Total attempts for a failing test before it is reported as failed.
# Kept for parity with the hosted environments.
retry=3

# A local instance answers immediately or not at all.
http.connect.timeout.millis=5000
http.socket.timeout.millis=15000

# The one environment allowed to accept a self-signed certificate, because a
# developer's own instance often has nothing else.
tls.relaxed=true
