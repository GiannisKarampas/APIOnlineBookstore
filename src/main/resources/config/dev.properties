# Configuration for the 'dev' environment.
# Selected with: mvn test -Pdev

# Base URI of the Online Bookstore API under test.
rest.url=https://fakerestapi.azurewebsites.net

# Total attempts for a failing test before it is reported as failed.
# The API is a shared public sandbox, so a transient timeout must not fail the build.
retry=3

# Fail fast rather than letting a hung service consume the build timeout.
http.connect.timeout.millis=10000
http.socket.timeout.millis=30000

# Certificates must validate. See local.properties for the one exception.
tls.relaxed=false
